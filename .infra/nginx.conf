# Serve o dist/ na raiz. Em produção a página fica em querobolsa.com.br/100-questoes-do-enem
# via cloudflare-workers/reverse-proxy, que tira o prefixo `/__100-questoes-do-enem` (o `base`
# do Vite) antes de chegar aqui.
server {
  listen       80;
  server_name  _;
  root   /usr/share/nginx/html;
  index  index.html;

  # Location relativo nos redirects: atrás do proxy, um Location absoluto vazaria o host interno.
  absolute_redirect off;

  # Acesso direto pelo *.quero.app: o HTML pede os arquivos sob o `base` do Vite.
  rewrite ^/__100-questoes-do-enem/(.*)$ /$1 last;

  # Assets com hash no nome: cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # O mime.types padrão do nginx não mapeia .ttf (sairia application/octet-stream).
  location /brand/fonts/ {
    default_type font/ttf;
  }

  # O index.html nunca é cacheado: ele aponta pro JS/CSS com hash do deploy atual.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
